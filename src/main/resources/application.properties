spring.application.name=spring_claude_tools
logging.threshold.console=info

# Web \u670D\u52A1\u7AEF\u53E3\uFF08\u8BBF\u95EE http://localhost:8800 \u6253\u5F00\u5BF9\u8BDD\u9875\u9762\uFF09
server.port=8800

# \u7EC8\u7AEF REPL \u5F00\u5173\uFF1A\u9ED8\u8BA4\u5173\u95ED\uFF0C\u6539\u7528\u7F51\u9875\u754C\u9762\u3002
# \u9700\u8981\u5728\u7EC8\u7AEF\u91CC\u5BF9\u8BDD\u65F6\u52A0 --agent.cli.enabled=true \u542F\u52A8
agent.cli.enabled=false

# ============================================================
# \u654F\u611F\u914D\u7F6E\uFF08API Key\u3001\u6570\u636E\u5E93\u8D26\u53F7\u5BC6\u7801\u7B49\uFF09\u8BF7\u653E\u5728
# application-dev.properties \u4E2D\uFF0C\u8BE5\u6587\u4EF6\u5DF2\u88AB .gitignore \u5FFD\u7565\u3002
# \u542F\u52A8\u65F6\u9700\u6FC0\u6D3B dev profile\uFF1A--spring.profiles.active=dev
# ============================================================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.model=deepseek-chat
spring.ai.deepseek.chat.base-url=https://api.deepseek.com
logging.level.org.springframework.ai.chat.client.advisor=debug

# Transformers embedding\uFF08RAG \u7528\u672C\u5730 ONNX \u6A21\u578B\uFF09\uFF1A\u542F\u52A8\u65F6\u4ECE GitHub \u62C9\u53D6\u6A21\u578B\u4E0E\u5206\u8BCD\u5668\u3002
# \u672C\u673A github.com / raw.githubusercontent.com \u4E0D\u53EF\u8FBE\uFF0Cmedia.githubusercontent.com \u53EF\u901A\uFF1B
# tokenizer \u8D70 jsdelivr \u955C\u50CF\u3002\u4E0B\u8F7D\u4E00\u6B21\u540E\u7531 ResourceCacheService \u7F13\u5B58\u5230\u672C\u5730\uFF0C
# \u82E5\u4ECD\u62C9\u53D6\u5931\u8D25\u53EF\u628A\u4E0B\u9762\u4E24\u4E2A uri \u6539\u4E3A file: \u672C\u5730\u8DEF\u5F84\u3002
# \u4E2D\u6587\u573A\u666F\u6362\u7528\u591A\u8BED\u8A00\u6A21\u578B\uFF08384\u7EF4\uFF0C\u4E0E all-MiniLM-L6-v2 \u540C\u7EF4\u5EA6\uFF0C\u8868\u7ED3\u6784\u4E0D\u53D8\uFF09
# model files must be downloaded once manually (hf-mirror.com, huggingface.co is unreachable here):
#   mkdir -p ~/.cache/spring-ai-model/multilingual
#   curl -L -o ~/.cache/spring-ai-model/multilingual/tokenizer.json \
#     https://hf-mirror.com/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json
#   curl -L -o ~/.cache/spring-ai-model/multilingual/model_quantized.onnx \
#     https://hf-mirror.com/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx
# on a new machine run the two curl commands above, or copy the directory over.
spring.ai.embedding.transformer.tokenizer.uri=file:${user.home}/.cache/spring-ai-model/multilingual/tokenizer.json

# Redis \u914D\u7F6E (ChatMemoryRepository)
spring.ai.chat.memory.repository.redis.host=localhost
spring.ai.chat.memory.repository.redis.port=6379
spring.ai.chat.memory.repository.redis.key-prefix=chat-memory:
spring.ai.chat.memory.repository.redis.time-to-live=30d

# JDBC \u6570\u636E\u5E93\uFF08DatabaseTools\uFF0CSpring Boot \u81EA\u52A8\u88C5\u914D HikariCP \u8FDE\u63A5\u6C60\uFF09
# \u6CE8\u610F\uFF1A\u9009\u4E86\u81EA\u52A8\u6CE8\u5165\u65B9\u5F0F\u540E\uFF0C\u8FD9\u91CC\u5FC5\u987B\u914D\u7F6E\uFF0C\u5426\u5219\u542F\u52A8\u4F1A\u56E0
# "Failed to configure a DataSource" \u5931\u8D25\uFF08Spring Boot \u6807\u51C6\u884C\u4E3A\uFF09
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demo?useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# \u8FDE\u63A5\u6C60\u5927\u5C0F\uFF08\u53EF\u9009\uFF09
spring.datasource.maximum-pool-size=5
# \u662F\u5426\u5141\u8BB8\u5199\u64CD\u4F5C\uFF08INSERT/UPDATE/DELETE/DDL\uFF09\uFF0C\u9ED8\u8BA4\u4EC5\u53EA\u8BFB\u67E5\u8BE2
agent.db.allow-write=false

# \u5DE5\u5177\u7EC4\u5F00\u5173\uFF1A\u4E3A false \u65F6\u8BE5\u5DE5\u5177\u4E0D\u52A0\u8F7D\u7ED9\u6A21\u578B
# Redis \u4E0D\u53EF\u7528\u65F6 MemoryTools \u4F1A\u81EA\u52A8\u8DF3\u8FC7\uFF0C\u65E0\u9700\u624B\u52A8\u5173
# agent.tools.memory.enabled=true
# agent.tools.web-search.enabled=true

# Shell \u6267\u884C\u80FD\u529B\uFF08ShellTools\uFF09\uFF0C\u9ED8\u8BA4\u5173\u95ED
agent.shell.enabled=true

# \u6A21\u578B\u8C03\u7528\u672A\u6CE8\u518C\u7684\u5DE5\u5177\uFF08\u5982\u5386\u53F2\u91CC\u7684 Bash\uFF09\u65F6\u8D70 UnknownToolFallbackConfiguration \u8FD4\u56DE\u63D0\u793A\uFF0C\u4E0D\u518D\u629B\u5F02\u5E38
spring.ai.tools.resolution.fallback.enabled=true

# \u8054\u7F51\u641C\u7D22\u5F00\u5173\uFF08WebSearchTools\uFF09
agent.tools.web-search.enabled=true
# GitHub \u5DE5\u5177\uFF08GithubTools\uFF09
# Token \u4E3A\u53EF\u9009\u9879\uFF1A\u4E0D\u914D\u7F6E\u4EE5\u533F\u540D\u65B9\u5F0F\u8BBF\u95EE\uFF08\u9650\u6D41 60 \u6B21/\u5C0F\u65F6\uFF0C\u65E0\u6CD5\u8BBF\u95EE\u79C1\u6709\u4ED3\u5E93\u3001\u65E0\u6CD5\u4EE3\u7801\u641C\u7D22\uFF09
# \u914D\u7F6E\u540E\u9650\u6D41 5000 \u6B21/\u5C0F\u65F6\uFF0C\u53EF\u7528\u4EE3\u7801\u641C\u7D22\u4E0E\u79C1\u6709\u4ED3\u5E93
# \u751F\u6210\u5730\u5740\uFF1Ahttps://github.com/settings/tokens
agent.github.token=${GITHUB_TOKEN:}

# ============================================================
# RAG \u68C0\u7D22\u589E\u5F3A\u914D\u7F6E
# ------------------------------------------------------------
# \u94FE\u8DEF\uFF1A\u6587\u6863 \u2192 \u5207\u5757 \u2192 \u672C\u5730 Embedding \u5411\u91CF\u5316 \u2192 PGVector \u5B58\u50A8
#       \u63D0\u95EE \u2192 \u5411\u91CF\u5316 \u2192 \u76F8\u4F3C\u5EA6\u68C0\u7D22 TopK \u2192 \u6CE8\u5165 Prompt \u2192 \u751F\u6210\u7B54\u6848
#
# \u6CE8\u610F\uFF1A\u8FD9\u91CC\u53EA\u914D\u5411\u91CF\u5E93\u8FDE\u63A5\uFF0CEmbedding \u8D70\u672C\u5730 ONNX \u6A21\u578B\uFF0C\u4E0D\u6D88\u8017\u5916\u90E8 API\u3002
# \u77E5\u8BC6\u5E93\u6570\u636E\u6E90\uFF08PGVector\uFF09\u4E0E\u4E1A\u52A1\u6570\u636E\u6E90\uFF08MySQL\uFF09\u662F\u4E24\u4E2A\u72EC\u7ACB\u8FDE\u63A5\uFF0C
# \u56E0\u6B64\u5FC5\u987B\u7528 @primary \u6807\u6CE8\u4E1A\u52A1\u6570\u636E\u6E90\uFF0C\u89C1 DataSourceConfiguration\u3002
# ============================================================

# --- PGVector \u5411\u91CF\u5E93\u8FDE\u63A5 ---
spring.ai.vectorstore.pgvector.url=jdbc:postgresql://localhost:5432/ragdb
spring.ai.vectorstore.pgvector.username=${PG_USERNAME:chengzhengbo}
spring.ai.vectorstore.pgvector.password=${PG_PASSWORD:}
# \u8868\u540D\u4E0E\u7D22\u5F15\u7C7B\u578B\uFF1AHNSW \u9002\u5408\u8BFB\u591A\u5199\u5C11\uFF0CIVFFlat \u9002\u5408\u5927\u6279\u91CF\u5199\u5165
spring.ai.vectorstore.pgvector.table-name=rag_documents
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# \u5411\u91CF\u7EF4\u5EA6\u5FC5\u987B\u4E0E Embedding \u6A21\u578B\u4E00\u81F4\u3002all-MiniLM-L6-v2 \u8F93\u51FA 384 \u7EF4
spring.ai.vectorstore.pgvector.dimensions=384
# \u9996\u6B21\u542F\u52A8\u81EA\u52A8\u5EFA\u8868\u5E76\u542F\u7528 vector \u6269\u5C55
spring.ai.vectorstore.pgvector.initialize-schema=true

# --- \u672C\u5730 Transformers Embedding ---
# \u9ED8\u8BA4\u6A21\u578B all-MiniLM-L6-v2\uFF0C\u9996\u6B21\u8C03\u7528\u81EA\u52A8\u4E0B\u8F7D\uFF08\u7EA6 90MB\uFF09\uFF0C\u4E4B\u540E\u79BB\u7EBF\u53EF\u7528
# \u6539\u7528 2.0.1 \u65B0\u9ED8\u8BA4\u5730\u5740\uFF08media.githubusercontent.com \u5DF2\u9A8C\u8BC1\u53EF\u901A\uFF09
# old model (English-only, poor Chinese retrieval) was:
#   model: https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
#   tokenizer: https://cdn.jsdelivr.net/gh/spring-projects/spring-ai@main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
# current: paraphrase-multilingual-MiniLM-L12-v2 (384 dims, good Chinese)
spring.ai.embedding.transformer.onnx.model-uri=file:${user.home}/.cache/spring-ai-model/multilingual/model_quantized.onnx
spring.ai.embedding.transformer.cache.enabled=true
# \u56FA\u5B9A\u7F13\u5B58\u76EE\u5F55\uFF1A\u9ED8\u8BA4\u6BCF\u6B21\u542F\u52A8\u751F\u6210\u968F\u673A temp \u76EE\u5F55\u4F1A\u91CD\u590D\u4E0B\u8F7D 90MB \u6A21\u578B
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/spring-ai-model
