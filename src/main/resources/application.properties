spring.application.name=spring_claude_tools
logging.threshold.console=info

# Web 服务端口（访问 http://localhost:8800 打开对话页面）
server.port=8800

# 终端 REPL 开关：默认关闭，改用网页界面。
# 需要在终端里对话时加 --agent.cli.enabled=true 启动
agent.cli.enabled=false

# ============================================================
# 敏感配置（API Key、数据库账号密码等）请放在
# application-dev.properties 中，该文件已被 .gitignore 忽略。
# 启动时需激活 dev profile：--spring.profiles.active=dev
# ============================================================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.model=deepseek-chat
spring.ai.deepseek.chat.base-url=https://api.deepseek.com
logging.level.org.springframework.ai.chat.client.advisor=debug

# Transformers embedding（RAG 用本地 ONNX 模型）：启动时从 GitHub 拉取模型与分词器。
# 本机 github.com / raw.githubusercontent.com 不可达，media.githubusercontent.com 可通；
# tokenizer 走 jsdelivr 镜像。下载一次后由 ResourceCacheService 缓存到本地，
# 若仍拉取失败可把下面两个 uri 改为 file: 本地路径。
spring.ai.embedding.transformer.tokenizer.uri=https://cdn.jsdelivr.net/gh/spring-projects/spring-ai@main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json

# Redis 配置 (ChatMemoryRepository)
spring.ai.chat.memory.repository.redis.host=localhost
spring.ai.chat.memory.repository.redis.port=6379
spring.ai.chat.memory.repository.redis.key-prefix=chat-memory:
spring.ai.chat.memory.repository.redis.time-to-live=30d

# JDBC 数据库（DatabaseTools，Spring Boot 自动装配 HikariCP 连接池）
# 注意：选了自动注入方式后，这里必须配置，否则启动会因
# "Failed to configure a DataSource" 失败（Spring Boot 标准行为）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demo?useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# 连接池大小（可选）
spring.datasource.maximum-pool-size=5
# 是否允许写操作（INSERT/UPDATE/DELETE/DDL），默认仅只读查询
agent.db.allow-write=false

# 工具组开关：为 false 时该工具不加载给模型
# Redis 不可用时 MemoryTools 会自动跳过，无需手动关
# agent.tools.memory.enabled=true
# agent.tools.web-search.enabled=true

# Shell 执行能力（ShellTools），默认关闭
agent.shell.enabled=true

# 模型调用未注册的工具（如历史里的 Bash）时走 UnknownToolFallbackConfiguration 返回提示，不再抛异常
spring.ai.tools.resolution.fallback.enabled=true

# 联网搜索开关（WebSearchTools）
agent.tools.web-search.enabled=true
# GitHub 工具（GithubTools）
# Token 为可选项：不配置以匿名方式访问（限流 60 次/小时，无法访问私有仓库、无法代码搜索）
# 配置后限流 5000 次/小时，可用代码搜索与私有仓库
# 生成地址：https://github.com/settings/tokens
agent.github.token=${GITHUB_TOKEN:}

# ============================================================
# RAG 检索增强配置
# ------------------------------------------------------------
# 链路：文档 → 切块 → 本地 Embedding 向量化 → PGVector 存储
#       提问 → 向量化 → 相似度检索 TopK → 注入 Prompt → 生成答案
#
# 注意：这里只配向量库连接，Embedding 走本地 ONNX 模型，不消耗外部 API。
# 知识库数据源（PGVector）与业务数据源（MySQL）是两个独立连接，
# 因此必须用 @primary 标注业务数据源，见 DataSourceConfiguration。
# ============================================================

# --- PGVector 向量库连接 ---
spring.ai.vectorstore.pgvector.url=jdbc:postgresql://localhost:5432/ragdb
spring.ai.vectorstore.pgvector.username=${PG_USERNAME:chengzhengbo}
spring.ai.vectorstore.pgvector.password=${PG_PASSWORD:}
# 表名与索引类型：HNSW 适合读多写少，IVFFlat 适合大批量写入
spring.ai.vectorstore.pgvector.table-name=rag_documents
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# 向量维度必须与 Embedding 模型一致。all-MiniLM-L6-v2 输出 384 维
spring.ai.vectorstore.pgvector.dimensions=384
# 首次启动自动建表并启用 vector 扩展
spring.ai.vectorstore.pgvector.initialize-schema=true

# --- 本地 Transformers Embedding ---
# 默认模型 all-MiniLM-L6-v2，首次调用自动下载（约 90MB），之后离线可用
# 旧地址 spring-ai-all-MiniLM-L6-v2.zip 已失效且 github.com 本机不可达；
# 改用 2.0.1 新默认地址（media.githubusercontent.com 已验证可通）
spring.ai.embedding.transformer.onnx.model-uri=https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.cache.enabled=true
# 固定缓存目录：默认每次启动生成随机 temp 目录会重复下载 90MB 模型
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/spring-ai-model
