spring.application.name=spring_claude_tools
logging.threshold.console=info

# Web 服务端口（访问 http://localhost:8800 打开对话页面）
server.port=8800

# 终端 REPL 开关：默认关闭，改用网页界面。
# 需要在终端里对话时加 --agent.cli.enabled=true 启动
agent.cli.enabled=false

# ============================================================
# 敏感配置（API Key、数据库账号密码等）请放在
# application-dev.properties 中，该文件已被 .gitignore 忽略。
# 启动时需激活 dev profile：--spring.profiles.active=dev
# ============================================================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.model=deepseek-chat
spring.ai.deepseek.chat.base-url=https://api.deepseek.com
logging.level.org.springframework.ai.chat.client.advisor=debug

# Redis 配置 (ChatMemoryRepository)
spring.ai.chat.memory.repository.redis.host=localhost
spring.ai.chat.memory.repository.redis.port=6379
spring.ai.chat.memory.repository.redis.key-prefix=chat-memory:
spring.ai.chat.memory.repository.redis.time-to-live=30d

# JDBC 数据库（DatabaseTools，Spring Boot 自动装配 HikariCP 连接池）
# 注意：选了自动注入方式后，这里必须配置，否则启动会因
# "Failed to configure a DataSource" 失败（Spring Boot 标准行为）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demo?useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# 连接池大小（可选）
spring.datasource.maximum-pool-size=5
# 是否允许写操作（INSERT/UPDATE/DELETE/DDL），默认仅只读查询
agent.db.allow-write=false

# 工具组开关：为 false 时该工具不加载给模型
# Redis 不可用时 MemoryTools 会自动跳过，无需手动关
# agent.tools.memory.enabled=true
# agent.tools.web-search.enabled=true

# Shell 执行能力（ShellTools），默认关闭
agent.shell.enabled=true

# 模型调用未注册的工具（如历史里的 Bash）时走 UnknownToolFallbackConfiguration 返回提示，不再抛异常
spring.ai.tools.resolution.fallback.enabled=true

# 联网搜索开关（WebSearchTools）
agent.tools.web-search.enabled=true
# GitHub 工具（GithubTools）
# Token 为可选项：不配置以匿名方式访问（限流 60 次/小时，无法访问私有仓库、无法代码搜索）
# 配置后限流 5000 次/小时，可用代码搜索与私有仓库
# 生成地址：https://github.com/settings/tokens
agent.github.token=${GITHUB_TOKEN:}
